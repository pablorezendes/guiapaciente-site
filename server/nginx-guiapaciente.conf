# =============================================================
# Nginx - Guia do Paciente HSFA
# Subdominio: guiapaciente.hsfasaude.com.br -> Node (porta 3010)
#
# Instalacao:
#   sudo cp server/nginx-guiapaciente.conf \
#     /etc/nginx/sites-available/guiapaciente.hsfasaude.com.br
#   sudo ln -sf /etc/nginx/sites-available/guiapaciente.hsfasaude.com.br \
#     /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d guiapaciente.hsfasaude.com.br
# =============================================================

# Upstream para o app PM2
upstream guiapaciente_app {
    server 127.0.0.1:3010;
    keepalive 32;
}

# HTTP -> HTTPS (Certbot adiciona o redirect aqui)
server {
    listen 80;
    listen [::]:80;
    server_name guiapaciente.hsfasaude.com.br;

    # Permitir desafio ACME do Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (Certbot completa as diretivas ssl_* automaticamente)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name guiapaciente.hsfasaude.com.br;

    # ---- TLS (preenchido pelo Certbot) ----
    # ssl_certificate     /etc/letsencrypt/live/guiapaciente.hsfasaude.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/guiapaciente.hsfasaude.com.br/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ---- Logs ----
    access_log /var/log/nginx/guiapaciente.access.log;
    error_log  /var/log/nginx/guiapaciente.error.log warn;

    # ---- Limites ----
    client_max_body_size 8m;

    # ---- Headers de seguranca ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Compressao (Express ja faz, mas reforca aqui) ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml+rss
        image/svg+xml;

    # ---- PWA: service worker NUNCA cacheado pelo proxy ----
    location = /sw.js {
        proxy_pass http://guiapaciente_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # ---- Assets com hash do Vite: cache longo ----
    location ^~ /assets/ {
        proxy_pass http://guiapaciente_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # ---- Imagens / icones / fontes locais: cache medio ----
    location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|eot)$ {
        proxy_pass http://guiapaciente_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public" always;
    }

    # ---- Health check ----
    location = /health {
        proxy_pass http://guiapaciente_app;
        access_log off;
    }

    # ---- App (proxy para Node/Express porta 3010) ----
    location / {
        proxy_pass http://guiapaciente_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
